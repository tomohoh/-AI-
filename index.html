<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>ABE語録レコメンダー</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #111412;
  --surface: #191f1d;
  --surface-strong: #202825;
  --line: #31403a;
  --text: #f1f7f0;
  --muted: #a9b8b0;
  --green: #6ee7a8;
  --amber: #f3b555;
  --coral: #ff7d68;
  --blue: #79b8ff;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  min-height: 44px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.app-shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 48px;
}

.topbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.eyebrow {
  margin: 0 0 6px;
  color: var(--green);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(1.8rem, 4vw, 3.4rem);
  line-height: 1.08;
}

h2 {
  margin-bottom: 10px;
  font-size: 1.05rem;
}

.muted {
  margin-bottom: 0;
  color: var(--muted);
}

.tabs {
  display: flex;
  width: fit-content;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.tab {
  min-width: 92px;
  padding: 0 14px;
  color: var(--muted);
  background: transparent;
}

.tab.is-active {
  color: #092016;
  background: var(--green);
}

.view {
  display: none;
}

.view.is-active {
  display: block;
}

.panel,
.field-card,
.quote-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.intro-panel,
.admin-head,
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.panel {
  padding: 18px;
}

.risk-pill {
  flex: none;
  padding: 9px 12px;
  border: 1px solid rgba(255, 125, 104, 0.55);
  border-radius: 8px;
  color: #ffe1dc;
  background: rgba(255, 125, 104, 0.18);
  font-weight: 800;
}

.workspace-form {
  margin-top: 18px;
}

.text-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.field-card,
.admin-form label,
.admin-search label,
.tone-field {
  display: grid;
  gap: 9px;
}

.field-card {
  padding: 16px;
}

label > span,
.tone-field legend {
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 700;
}

.field-help {
  margin: -2px 0 0;
  color: #c7d4ce;
  font-size: 0.82rem;
  line-height: 1.55;
}

textarea,
input,
select {
  width: 100%;
  border: 1px solid #40514a;
  border-radius: 8px;
  background: #0c100f;
  color: var(--text);
  outline: none;
}

textarea:focus,
input:focus,
select:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(110, 231, 168, 0.14);
}

textarea {
  min-height: 260px;
  resize: vertical;
  padding: 14px;
  line-height: 1.65;
}

input,
select {
  min-height: 44px;
  padding: 0 12px;
}

.controls-row {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) minmax(190px, 280px);
  gap: 14px;
  align-items: end;
  margin: 16px 0 18px;
}

.tone-field {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.tone-field legend {
  margin-bottom: 9px;
  padding: 0;
}

.tone-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tone-option {
  position: relative;
  display: inline-flex;
  min-width: 0;
  min-height: 44px;
}

.tone-option input {
  position: absolute;
  inset: 0;
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  opacity: 0;
  cursor: pointer;
}

.tone-option span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid #40514a;
  border-radius: 8px;
  background: #0c100f;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 800;
  white-space: nowrap;
}

.tone-option input:checked + span {
  border-color: var(--green);
  color: #092016;
  background: var(--green);
}

.tone-option input:focus-visible + span {
  box-shadow: 0 0 0 3px rgba(110, 231, 168, 0.14);
}

.primary-button,
.secondary-button,
.ghost-button,
.copy-button {
  min-width: 120px;
  padding: 0 16px;
  font-weight: 800;
}

.primary-button {
  color: #092016;
  background: var(--green);
}

.primary-button:hover {
  background: #8bf0bc;
}

.secondary-button {
  color: #10140d;
  background: var(--amber);
}

.ghost-button {
  border: 1px solid var(--line);
  color: var(--text);
  background: var(--surface-strong);
}

.small {
  min-width: 108px;
}

.analysis-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin: 18px 0 22px;
}

.summary-list {
  display: grid;
  gap: 10px;
}

.summary-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}

.summary-item:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.summary-item span:first-child {
  flex: none;
  color: var(--muted);
  font-size: 0.86rem;
}

.summary-item span:last-child {
  text-align: right;
}

.section-heading {
  margin-bottom: 14px;
}

.section-heading h2 {
  margin-bottom: 0;
}

.results {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 14px;
}

.quote-card {
  display: grid;
  grid-template-rows: auto minmax(130px, auto) 1fr auto;
  gap: 14px;
  min-width: 0;
  padding: 16px;
}

.quote-card-head {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 0.76rem;
  font-weight: 800;
}

.category-badge {
  color: #d8ecff;
  background: rgba(121, 184, 255, 0.18);
}

.safety-badge.safe {
  color: #d8ffe8;
  background: rgba(110, 231, 168, 0.18);
}

.safety-badge.caution {
  color: #ffefcc;
  background: rgba(243, 181, 85, 0.22);
}

.safety-badge.blocked {
  color: #ffe1dc;
  background: rgba(255, 125, 104, 0.22);
}

blockquote {
  margin: 0;
  color: #ffffff;
  font-size: 1.08rem;
  font-weight: 800;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

dl {
  display: grid;
  gap: 10px;
  margin: 0;
}

dl div {
  display: grid;
  gap: 3px;
}

dt {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
}

dd {
  margin: 0;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.copy-button {
  color: #081513;
  background: #a4d8ff;
}

.copy-actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

.copy-actions .copy-button {
  min-width: 0;
  padding: 0 10px;
  font-size: 0.84rem;
  line-height: 1.25;
  white-space: normal;
}

.credit-copy {
  color: #10140d;
  background: var(--amber);
}

.copy-button.is-copied {
  background: var(--green);
}

.empty-state {
  padding: 22px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  color: var(--muted);
  text-align: center;
}

.admin-head {
  margin-bottom: 16px;
}

.admin-actions,
.form-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
}

.admin-form {
  display: grid;
  gap: 14px;
  margin-bottom: 16px;
}

.admin-form textarea {
  min-height: 118px;
}

.admin-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.check-field {
  align-content: start;
}

.check-line {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 700;
}

.check-line input {
  width: 18px;
  min-height: 18px;
  padding: 0;
}

.admin-search {
  margin-bottom: 16px;
}

.quote-list {
  display: grid;
  gap: 12px;
}

.admin-quote {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.admin-quote p {
  margin-bottom: 7px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.admin-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.admin-quote-actions {
  display: flex;
  gap: 8px;
}

.admin-quote-actions button {
  min-width: 70px;
  min-height: 40px;
  padding: 0 10px;
}

@media (max-width: 1120px) {
  .results {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 780px) {
  .app-shell {
    width: min(100% - 20px, 680px);
    padding-top: 16px;
  }

  .topbar,
  .intro-panel,
  .admin-head,
  .section-heading {
    align-items: stretch;
    flex-direction: column;
  }

  .tabs {
    width: 100%;
  }

  .tab {
    flex: 1;
  }

  .text-grid,
  .analysis-grid,
  .results,
  .controls-row,
  .admin-grid {
    grid-template-columns: 1fr;
  }

  textarea {
    min-height: 210px;
  }

  .summary-item span:last-child {
    text-align: left;
  }

  .admin-actions,
  .form-buttons {
    justify-content: stretch;
  }

  .admin-actions button,
  .form-buttons button,
  .primary-button,
  .secondary-button,
  .ghost-button {
    width: 100%;
  }

  .admin-quote {
    grid-template-columns: 1fr;
  }
}

</style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Meme quote matcher</p>
          <h1>ABE語録レコメンダー</h1>
        </div>
        <nav class="tabs" aria-label="画面切り替え">
          <button class="tab is-active" type="button" data-view="matcher">おすすめ</button>
          <button class="tab" type="button" data-view="admin">管理・検索</button>
        </nav>
      </header>

      <main>
        <section id="matcherView" class="view is-active" aria-labelledby="matcherTitle">
          <div class="panel intro-panel">
            <div>
              <h2 id="matcherTitle">レス入力</h2>
              <p id="quoteCount" class="muted">語録を読み込み中</p>
            </div>
            <div id="riskPill" class="risk-pill" hidden>使用非推奨</div>
          </div>

          <form id="matchForm" class="workspace-form">
            <div class="text-grid">
              <label class="field-card">
                <span>自分のレス</span>
                <textarea
                  id="selfInput"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="例: 90:名無しさん&#10;それは根拠が薄いと思う"
                ></textarea>
              </label>

              <label class="field-card">
                <span>相手のレス</span>
                <textarea
                  id="opponentInput"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="例: 96:名無しさん&#10;&gt;&gt;90&#10;それって嘘だよね？"
                ></textarea>
              </label>
            </div>

            <div class="controls-row">
              <fieldset class="tone-field">
                <legend>返答タイプ</legend>
                <div class="tone-options" id="replyTypeGroup">
                  <label class="tone-option"><input type="checkbox" name="replyType" value="反論" checked /><span>反論</span></label>
                  <label class="tone-option"><input type="checkbox" name="replyType" value="煽り" /><span>煽り</span></label>
                  <label class="tone-option"><input type="checkbox" name="replyType" value="ネタ" /><span>ネタ</span></label>
                  <label class="tone-option"><input type="checkbox" name="replyType" value="自己弁護" /><span>自己弁護</span></label>
                  <label class="tone-option"><input type="checkbox" name="replyType" value="応援" /><span>応援</span></label>
                  <label class="tone-option"><input type="checkbox" name="replyType" value="感謝" /><span>感謝</span></label>
                  <label class="tone-option"><input type="checkbox" name="replyType" value="ランダム" /><span>ランダム</span></label>
                </div>
              </fieldset>
              <button class="primary-button" type="submit">おすすめ語録を表示</button>
            </div>
          </form>

          <section class="analysis-grid" aria-label="解析結果">
            <div class="panel">
              <h2>文脈</h2>
              <div id="contextSummary" class="summary-list"></div>
            </div>
            <div class="panel">
              <h2>安全性</h2>
              <div id="safetySummary" class="summary-list"></div>
            </div>
          </section>

          <section aria-labelledby="resultsTitle">
            <div class="section-heading">
              <h2 id="resultsTitle">おすすめ上位5件</h2>
              <button id="shuffleButton" class="ghost-button" type="button" disabled>別の語録を表示</button>
            </div>
            <div id="results" class="results"></div>
          </section>
        </section>

        <section id="adminView" class="view" aria-labelledby="adminTitle">
          <div class="panel admin-head">
            <div>
              <h2 id="adminTitle">語録管理</h2>
              <p class="muted">編集内容はこのブラウザ内に保存できます</p>
            </div>
            <div class="admin-actions">
              <button id="saveLocalButton" class="secondary-button" type="button">ブラウザ保存</button>
            </div>
          </div>

          <form id="quoteForm" class="admin-form panel">
            <input id="quoteId" type="hidden" />
            <label>
              <span>語録本文</span>
              <textarea id="quoteText" required></textarea>
            </label>
            <div class="admin-grid">
              <label>
                <span>カテゴリ</span>
                <select id="quoteCategory"></select>
              </label>
              <label>
                <span>トーン</span>
                <select id="quoteTone">
                  <option>反論</option>
                  <option>煽り</option>
                  <option>ネタ</option>
                  <option>自己弁護</option>
                  <option>応援</option>
                  <option>感謝</option>
                  <option>ランダム</option>
                </select>
              </label>
              <label>
                <span>強さ</span>
                <input id="quoteIntensity" type="number" min="1" max="5" value="2" />
              </label>
              <label>
                <span>安全性</span>
                <select id="quoteSafety">
                  <option value="safe">safe</option>
                  <option value="caution">caution</option>
                  <option value="blocked">blocked</option>
                </select>
              </label>
            </div>
            <label>
              <span>タグ</span>
              <input id="quoteTags" type="text" placeholder="反論, 根拠, デマ" />
            </label>
            <label>
              <span>用途</span>
              <input id="quoteUseCase" type="text" />
            </label>
            <div class="admin-grid">
              <label>
                <span>triggerWords</span>
                <p class="field-help">入力文にここで指定した単語が含まれると、この語録を強く優先します。複数指定する場合はカンマ区切りで入力します。</p>
                <input id="quoteTriggers" type="text" placeholder="カツカレー, 日教組" />
              </label>
              <label class="check-field">
                <span class="check-line">
                  <input id="quoteTriggerOnly" type="checkbox" />
                  <span>triggerOnly</span>
                </span>
                <p class="field-help">オンにすると、triggerWordsの単語が入力文に出た時だけ候補に表示します。普段は出したくないレア語録向けです。</p>
              </label>
            </div>
            <div class="form-buttons">
              <button class="primary-button small" type="submit">追加・更新</button>
              <button id="clearFormButton" class="ghost-button" type="button">フォームを空にする</button>
            </div>
          </form>

          <div class="admin-search panel">
            <label>
              <span>検索</span>
              <input id="adminSearch" type="search" placeholder="語録、カテゴリ、タグ" />
            </label>
          </div>

          <div id="quoteList" class="quote-list"></div>
        </section>
      </main>
    </div>

    <template id="resultTemplate">
      <article class="quote-card">
        <div class="quote-card-head">
          <span class="badge category-badge"></span>
          <span class="badge safety-badge"></span>
        </div>
        <blockquote></blockquote>
        <dl>
          <div>
            <dt>返答タイプ</dt>
            <dd class="tone"></dd>
          </div>
          <div>
            <dt>強さレベル</dt>
            <dd class="intensity"></dd>
          </div>
        </dl>
        <div class="copy-actions">
          <button class="copy-button" type="button" data-copy-mode="plain">コピー</button>
          <button class="copy-button credit-copy" type="button" data-copy-mode="credit">by安倍晋三付きコピー</button>
        </div>
      </article>
    </template>

})();

  els.matchForm.addEventListener("submit", (event) => {
    event.preventDefault();
    runRecommendation(false);
  });

  els.shuffleButton.addEventListener("click", () => runRecommendation(true));
  els.replyTypeGroup.addEventListener("change", handleReplyTypeChange);
  els.quoteForm.addEventListener("submit", saveQuoteFromForm);
  els.clearFormButton.addEventListener("click", clearQuoteForm);
  els.saveLocalButton.addEventListener("click", saveQuotesToLocal);
  els.adminSearch.addEventListener("input", renderQuoteList);

  els.quoteList.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    const id = Number(button.dataset.id);
    if (button.dataset.action === "edit") editQuote(id);
    if (button.dataset.action === "delete") deleteQuote(id);
  });
}

async function loadQuotes() {
  const response = await fetch("./data/quotes.json", { cache: "no-store" });
  if (!response.ok) {
    throw new Error("quotes.json を読み込めませんでした");
  }
  const loaded = await response.json();
  state.defaultQuotes = normalizeQuotes(loaded);

  const saved = localStorage.getItem(STORAGE_KEY);
  state.quotes = saved ? normalizeQuotes(JSON.parse(saved)) : cloneQuotes(state.defaultQuotes);
}

function normalizeQuotes(quotes) {
  return quotes.map((quote, index) => ({
    id: Number(quote.id || index + 1),
    quote: String(quote.quote || "").trim(),
    category: quote.category || "ネタ・唐突・混沌枠",
    tags: Array.isArray(quote.tags) ? quote.tags.map(String).filter(Boolean) : [],
    tone: TONE_OPTIONS.includes(quote.tone) ? quote.tone : "ランダム",
    intensity: clamp(Number(quote.intensity || 2), 1, 5),
    useCase: quote.useCase || "",
    triggerWords: Array.isArray(quote.triggerWords) ? quote.triggerWords.map(String).filter(Boolean) : [],
    triggerOnly: Boolean(quote.triggerOnly),
    safety: ["safe", "caution", "blocked"].includes(quote.safety) ? quote.safety : "safe",
    hiddenByDefault: Boolean(quote.hiddenByDefault),
  }));
}

function cloneQuotes(quotes) {
  return JSON.parse(JSON.stringify(quotes));
}

function switchView(view) {
  els.tabs.forEach((tab) => tab.classList.toggle("is-active", tab.dataset.view === view));
  els.matcherView.classList.toggle("is-active", view === "matcher");
  els.adminView.classList.toggle("is-active", view === "admin");
}

function runRecommendation(showAlternates) {
  const context = buildContext(els.selfInput.value, els.opponentInput.value);
  const replyTypes = selectedReplyTypes();
  const requestKey = JSON.stringify({
    self: els.selfInput.value,
    opponent: els.opponentInput.value,
    replyTypes,
  });

  if (!showAlternates || state.lastRequestKey !== requestKey) {
    state.shownQuoteIds = [];
  }

  state.lastContext = context;
  state.lastReplyTypes = replyTypes;
  state.lastRequestKey = requestKey;

  const ranked = rankQuotes(context, replyTypes, showAlternates);
  const selected = selectRecommendationBatch(ranked, showAlternates);
  renderContextSummary(context);
  renderResults(selected, context);
  updateShuffleButton(context, ranked.length);
}

function selectRecommendationBatch(ranked, showAlternates) {
  if (!showAlternates) {
    const selected = ranked.slice(0, 5);
    rememberShownQuotes(selected);
    return selected;
  }

  const shown = new Set(state.shownQuoteIds);
  let candidates = ranked.filter((item) => !shown.has(item.quote.id));

  if (candidates.length === 0) {
    state.shownQuoteIds = [];
    candidates = ranked;
  }

  const selected = shuffleCandidates(candidates).slice(0, 5);
  rememberShownQuotes(selected);
  return selected;
}

function shuffleCandidates(candidates) {
  return candidates
    .map((item, index) => ({
      ...item,
      shuffleScore: item.score + Math.random() * 48 - index * 0.08,
    }))
    .sort((a, b) => b.shuffleScore - a.shuffleScore || a.quote.id - b.quote.id);
}

function rememberShownQuotes(results) {
  const known = new Set(state.shownQuoteIds);
  for (const result of results) {
    if (!known.has(result.quote.id)) {
      state.shownQuoteIds.push(result.quote.id);
      known.add(result.quote.id);
    }
  }
}

function updateShuffleButton(context, candidateCount) {
  const canShuffle = Boolean(context?.latestOpponent) && candidateCount > 0;
  els.shuffleButton.disabled = !canShuffle;
  els.shuffleButton.textContent =
    canShuffle && state.shownQuoteIds.length >= candidateCount
      ? "もう一度シャッフル"
      : "別の語録を表示";
}

function handleReplyTypeChange(event) {
  const changed = event.target.closest('input[name="replyType"]');
  if (!changed) return;

  if (changed.value === "ランダム" && changed.checked) {
    els.replyTypes.forEach((input) => {
      if (input !== changed) input.checked = false;
    });
  } else if (changed.checked) {
    const randomInput = [...els.replyTypes].find((input) => input.value === "ランダム");
    if (randomInput) randomInput.checked = false;
  }

  if (selectedReplyTypes().length === 0) {
    changed.checked = true;
  }
}

function selectedReplyTypes() {
  return [...els.replyTypes].filter((input) => input.checked).map((input) => input.value);
}

function buildContext(selfText, opponentText) {
  const selfPosts = parsePosts(selfText, "self", 0);
  const opponentPosts = parsePosts(opponentText, "opponent", selfPosts.length);
  const posts = [...selfPosts, ...opponentPosts].map((post, index) => ({
    ...post,
    index,
    text: cleanPostText(post.body),
    refs: extractRefs(post.body),
  }));

  const hasNumbers = posts.some((post) => Number.isFinite(post.number));
  const timeline = posts.slice().sort((a, b) => {
    if (hasNumbers) {
      const aKey = Number.isFinite(a.number) ? a.number : 1_000_000 + a.index;
      const bKey = Number.isFinite(b.number) ? b.number : 1_000_000 + b.index;
      if (aKey !== bKey) return aKey - bKey;
    }
    return a.index - b.index;
  });

  const opponentTimeline = timeline.filter((post) => post.role === "opponent");
  const selfTimeline = timeline.filter((post) => post.role === "self");
  const latestOpponent = opponentTimeline[opponentTimeline.length - 1] || null;
  const latestSelf = selfTimeline[selfTimeline.length - 1] || null;
  const referencedSelf = findReferencedSelf(latestOpponent, selfTimeline);
  const previousSelf = findPreviousSelf(latestOpponent, selfTimeline, latestSelf);
  const allText = [selfText, opponentText].join("\n");
  const features = analyzeFeatures({
    latestOpponent,
    previousSelf: referencedSelf || previousSelf || latestSelf,
    referencedSelf,
    timeline,
    allText,
  });

  return {
    posts,
    timeline,
    latestOpponent,
    latestSelf,
    referencedSelf,
    previousSelf: referencedSelf || previousSelf || latestSelf,
    features,
    allText,
    hasNumbers,
  };
}

function parsePosts(rawText, role, offset) {
  const text = rawText.replace(/\r\n?/g, "\n").trim();
  if (!text) return [];

  const lines = text.split("\n");
  const numberedHeaders = lines.map(parsePostHeader).filter(Boolean);
  const hasNumberedHeader = numberedHeaders.length >= 2 || numberedHeaders.some((header) => header.explicit);

  if (!hasNumberedHeader) {
    return text
      .split(/\n{2,}/)
      .map((body) => body.trim())
      .filter(Boolean)
      .map((body, index) => ({
        role,
        number: null,
        body,
        inputOrder: offset + index,
      }));
  }

  const posts = [];
  let current = null;

  for (const line of lines) {
    const header = parsePostHeader(line);
    if (header) {
      if (current) posts.push(current);
      current = {
        role,
        number: header.number,
        body: "",
        inputOrder: offset + posts.length,
      };
      if (header.rest && !looksLikeMeta(header.rest)) {
        current.body += `${header.rest}\n`;
      }
      continue;
    }

    if (!current) {
      current = {
        role,
        number: null,
        body: "",
        inputOrder: offset + posts.length,
      };
    }
    current.body += `${line}\n`;
  }

  if (current) posts.push(current);
  return posts.filter((post) => post.body.trim() || Number.isFinite(post.number));
}

function parsePostHeader(line) {
  const explicit = line.match(/^\s*(?:No\.?|#)?\s*(\d{1,7})\s*[:：]\s*(.*)$/i);
  if (explicit) {
    return { number: Number(explicit[1]), rest: explicit[2].trim(), explicit: true };
  }

  const prefixed = line.match(/^\s*(?:No\.?|#)\s*(\d{1,7})(?:\s*[).）\]]\s*|\s+)?(.*)$/i);
  if (prefixed) {
    return { number: Number(prefixed[1]), rest: prefixed[2].trim(), explicit: true };
  }

  const numbered = line.match(/^\s*(\d{1,7})(?:\s*[).）]\s*|\s+)(.*)$/);
  if (numbered) {
    return { number: Number(numbered[1]), rest: numbered[2].trim(), explicit: false };
  }

  const bare = line.match(/^\s*(\d{1,7})\s*$/);
  if (bare) {
    return { number: Number(bare[1]), rest: "", explicit: false };
  }

  return null;
}

function looksLikeMeta(text) {
  return /名無し|ID:|^\d{4}\/\d{1,2}\/\d{1,2}|[月火水木金土日]\)|\d{1,2}:\d{2}:\d{2}/.test(text);
}

function cleanPostText(text) {
  return text
    .split("\n")
    .map((line) => line.trim())
    .filter((line) => line && !/^>>\s*\d+/.test(line))
    .join("\n")
    .trim();
}

function extractRefs(text) {
  const refs = [];
  for (const match of text.matchAll(/>>\s*(\d{1,7})/g)) {
    refs.push(Number(match[1]));
  }
  return [...new Set(refs)];
}

function findReferencedSelf(latestOpponent, selfTimeline) {
  if (!latestOpponent || latestOpponent.refs.length === 0) return null;
  return selfTimeline.find((post) => Number.isFinite(post.number) && latestOpponent.refs.includes(post.number)) || null;
}

function findPreviousSelf(latestOpponent, selfTimeline, latestSelf) {
  if (!latestOpponent) return latestSelf;
  const before = selfTimeline.filter((post) => {
    if (Number.isFinite(post.number) && Number.isFinite(latestOpponent.number)) {
      return post.number < latestOpponent.number;
    }
    return post.index < latestOpponent.index;
  });
  return before[before.length - 1] || latestSelf || null;
}

function analyzeFeatures({ latestOpponent, previousSelf, referencedSelf, timeline, allText }) {
  const latestOpponentText = latestOpponent?.text || "";
  const previousSelfText = previousSelf?.text || "";
  const referencedSelfText = referencedSelf?.text || "";
  const recentText = timeline.slice(-6).map((post) => post.text).join("\n");
  const opponentRecentText = timeline
    .filter((post) => post.role === "opponent")
    .slice(-3)
    .map((post) => post.text)
    .join("\n");
  const wholeText = normalize(allText);
  const exclamationCount = (latestOpponentText.match(/[!！?？]/g) || []).length;
  const anchorBonus = referencedSelf ? 1.2 : 0;

  const scores = {};
  for (const [name, words] of Object.entries(CONTEXT_SIGNALS)) {
    scores[name] =
      scoreWords(latestOpponentText, words) * 3 +
      scoreWords(opponentRecentText, words) * 1.5 +
      scoreWords(previousSelfText, words) * 0.8 +
      scoreWords(referencedSelfText, words) * 1.1 +
      scoreWords(recentText, words) * 0.4;
  }
  scores.emotion += Math.min(5, exclamationCount) + anchorBonus;
  scores.selfDefense += anchorBonus;
  scores.question += exclamationCount > 0 && /[?？]/.test(latestOpponentText) ? 1.5 : 0;

  const riskMatches = matchRisk(wholeText);
  const toneHints = {
    反論: Math.max(scores.evidence, scores.distortion, scores.shift) + scores.question * 0.3,
    煽り: Math.max(scores.opponentVictory, scores.absurd, scores.emotion) - riskMatches.length * 4,
    ネタ: scores.absurd * 0.8 + (latestOpponentText.length <= 20 ? 1.5 : 0),
    自己弁護: scores.selfDefense + scores.question * 0.4,
    応援: scores.encouragement,
    感謝: scores.gratitude,
    ランダム: 1,
  };

  return {
    scores,
    toneHints,
    emotion: scores.emotion >= 2.5,
    evidence: scores.evidence >= 2,
    distortion: scores.distortion >= 2,
    shift: scores.shift >= 2,
    selfDefense: scores.selfDefense >= 2,
    absurd: scores.absurd >= 2,
    opponentVictory: scores.opponentVictory >= 2,
    question: scores.question >= 2,
    gratitude: scores.gratitude >= 2,
    encouragement: scores.encouragement >= 2,
    risk: riskMatches.length > 0,
    riskMatches,
  };
}

function matchRisk(normalizedText) {
  const checks = [
    ["脅迫", ["殺す", "しばく", "殴る", "燃やす", "爆破", "覚えてろ", "家に行く"]],
    ["個人情報", ["住所", "電話番号", "本名", "晒す", "晒し", "特定した", "勤務先", "学校名"]],
    ["差別", ["差別", "民族", "国籍", "障害者", "外人", "部落", "ヘイト"]],
    ["過度な攻撃", ["死ね", "消えろ", "人間として", "生きる価値", "クズ", "カス"]],
  ];
  return checks.filter(([, words]) => words.some((word) => normalizedText.includes(normalize(word)))).map(([label]) => label);
}

function scoreWords(text, words) {
  const normalizedText = normalize(text);
  if (!normalizedText) return 0;
  return words.reduce((score, word) => {
    const normalizedWord = normalize(word);
    if (!normalizedWord) return score;
    let index = normalizedText.indexOf(normalizedWord);
    let count = 0;
    while (index !== -1) {
      count += 1;
      index = normalizedText.indexOf(normalizedWord, index + normalizedWord.length);
    }
    return score + Math.min(3, count);
  }, 0);
}

function rankQuotes(context, replyTypes, randomize) {
  const scored = [];
  const inputText = normalize(context.allText);

  for (const quote of state.quotes) {
    const triggerMatches = quote.triggerWords.filter((word) => inputText.includes(normalize(word)));
    if (quote.safety === "blocked") continue;
    if (quote.triggerOnly && triggerMatches.length === 0) continue;
    if (quote.hiddenByDefault && triggerMatches.length === 0) continue;
    if (!replyTypeAllowsQuote(quote, replyTypes)) continue;
    if (context.features.risk && (quote.safety !== "safe" || quote.intensity > 3)) continue;

    const detail = scoreQuote(quote, context, replyTypes, triggerMatches, randomize);
    scored.push({ quote, ...detail });
  }

  scored.sort((a, b) => b.score - a.score || a.quote.id - b.quote.id);
  return scored;
}

function replyTypeAllowsQuote(quote, replyTypes) {
  if (replyTypes.includes("ランダム")) return true;
  return replyTypes.includes(quote.tone);
}

function scoreQuote(quote, context, replyTypes, triggerMatches, randomize) {
  let score = 10;
  const randomReply = replyTypes.includes("ランダム");
  const selectedTypes = replyTypes.filter((type) => type !== "ランダム");

  if (triggerMatches.length > 0) score += 82;

  if (!context.features.risk && !randomReply) {
    if (selectedTypes.includes(quote.tone)) score += 30;
    if (selectedTypes.some((type) => quote.tags.includes(type))) score += 18;
    if (selectedTypes.some((type) => categoryFitsReplyType(quote.category, type))) score += 15;
  } else {
    score += 8;
  }

  const featureScores = [
    ["distortion", "曲解・揚げ足取り指摘", 7],
    ["evidence", "根拠要求・デマ指摘", 7],
    ["emotion", "落ち着かせる・興奮抑制", 6],
    ["shift", "論点ずらし指摘", 7],
    ["selfDefense", "自己弁護・関与否定", 6],
    ["opponentVictory", "勝利宣言・追撃", 5],
    ["absurd", "呆れ・困惑", 6],
    ["question", "はぐらかし・答弁回避", 5],
  ];

  for (const [featureName, category, multiplier] of featureScores) {
    if (context.features[featureName] && quote.category === category) {
      score += Math.min(36, context.features.scores[featureName] * multiplier);
    }
  }

  if (context.features.absurd && quote.category === "ネタ・唐突・混沌枠") {
    score += Math.min(22, context.features.scores.absurd * 4);
  }

  if (context.features.gratitude && quote.tone === "感謝") score += Math.min(28, context.features.scores.gratitude * 7);
  if (context.features.encouragement && quote.tone === "応援") score += Math.min(28, context.features.scores.encouragement * 7);
  if (randomReply && quote.tone in context.features.toneHints) {
    score += Math.min(18, Math.max(0, context.features.toneHints[quote.tone] * 3));
  }

  score += keywordScore(quote, context).points;
  score -= Math.abs(quote.intensity - idealIntensity(replyTypes, context)) * 4;

  if (quote.safety === "caution") score -= context.features.risk ? 32 : 8;
  if (quote.safety === "safe") score += 3;
  if (context.features.risk && quote.category === "落ち着かせる・興奮抑制") score += 54;
  if (context.features.risk && quote.category === "はぐらかし・答弁回避") score += 30;
  if (context.features.risk && quote.category === "勝利宣言・追撃") score -= 40;
  if (context.referencedSelf) score += quote.category === "自己弁護・関与否定" ? 6 : 3;
  if (randomize || randomReply) score += Math.random() * 18;

  return { score, triggerMatches };
}

function categoryFitsReplyType(category, replyType) {
  const map = {
    反論: ["曲解・揚げ足取り指摘", "根拠要求・デマ指摘", "論点ずらし指摘"],
    煽り: ["勝利宣言・追撃", "呆れ・困惑", "ネタ・唐突・混沌枠"],
    ネタ: ["ネタ・唐突・混沌枠", "レア単語トリガー"],
    自己弁護: ["自己弁護・関与否定", "はぐらかし・答弁回避"],
    応援: ["勝利宣言・追撃", "ネタ・唐突・混沌枠"],
    感謝: ["ネタ・唐突・混沌枠"],
    ランダム: CATEGORY_OPTIONS,
  };
  return (map[replyType] || []).includes(category);
}

function idealIntensity(replyTypes, context) {
  if (context.features.risk || context.features.emotion) return 2;
  const map = { 反論: 3, 煽り: 3, ネタ: 2, 自己弁護: 2, 応援: 2, 感謝: 1, ランダム: 2 };
  const selectedTypes = replyTypes.filter((type) => type !== "ランダム");
  if (selectedTypes.length === 0) return 2;
  return selectedTypes.reduce((sum, type) => sum + (map[type] || 2), 0) / selectedTypes.length;
}

function keywordScore(quote, context) {
  const contextWords = normalize(`${context.latestOpponent?.text || ""}\n${context.previousSelf?.text || ""}`);
  const candidates = [...quote.tags, quote.category, quote.useCase].filter((word) => String(word).length >= 2);
  const hits = candidates.filter((word) => contextWords.includes(normalize(word)));
  return { points: Math.min(12, hits.length * 4) };
}

function renderResults(results, context) {
  els.results.textContent = "";

  if (!context.latestOpponent) {
    renderMessage(els.results, "相手のレスを入力すると候補が表示されます。");
    return;
  }

  if (results.length === 0) {
    renderMessage(els.results, "安全条件に合う候補がありません。入力を見直すか、管理画面でsafeの語録を追加してください。");
    return;
  }

  for (const result of results) {
    const node = els.resultTemplate.content.firstElementChild.cloneNode(true);
    const quote = result.quote;
    node.dataset.quoteId = String(quote.id);
    node.querySelector("blockquote").textContent = quote.quote;
    node.querySelector(".category-badge").textContent = quote.category;
    const safetyBadge = node.querySelector(".safety-badge");
    safetyBadge.textContent = SAFETY_LABELS[quote.safety] || "なし";
    safetyBadge.classList.add(quote.safety);
    node.querySelector(".tone").textContent = quote.tone;
    node.querySelector(".intensity").textContent = `${quote.intensity} / 5`;
    node.querySelector('[data-copy-mode="plain"]').addEventListener("click", async (event) => {
      await copyText(quote.quote, event.currentTarget);
    });
    node.querySelector('[data-copy-mode="credit"]').addEventListener("click", async (event) => {
      await copyText(`${quote.quote}（by安倍晋三）`, event.currentTarget);
    });
    els.results.append(node);
  }
}

function renderMessage(container, text) {
  const empty = document.createElement("div");
  empty.className = "empty-state";
  empty.textContent = text;
  container.append(empty);
}

function renderEmptyState() {
  els.results.textContent = "";
  renderMessage(els.results, "まだ候補はありません。");
  updateShuffleButton(null, 0);
}

function renderContextSummary(context) {
  els.contextSummary.textContent = "";
  els.safetySummary.textContent = "";

  if (!context) {
    appendSummary(els.contextSummary, "時系列", "未解析");
    appendSummary(els.contextSummary, "対象", "未解析");
    appendSummary(els.safetySummary, "判定", "未解析");
    els.riskPill.hidden = true;
    return;
  }

  const targetLabel = context.latestOpponent ? formatPostLabel(context.latestOpponent) : "相手レスなし";
  const selfLabel = context.previousSelf ? formatPostLabel(context.previousSelf) : "自分レスなし";
  appendSummary(els.contextSummary, "時系列", context.hasNumbers ? "レス番号の昇順" : "入力欄内の上から下");
  appendSummary(els.contextSummary, "返答対象", targetLabel);
  appendSummary(els.contextSummary, "直前の自分", selfLabel);
  appendSummary(els.contextSummary, "アンカー", context.referencedSelf ? `>>${context.referencedSelf.number} を反映` : "なし");

  const activeFeatures = Object.entries({
    曲解: context.features.distortion,
    根拠要求: context.features.evidence,
    興奮抑制: context.features.emotion,
    論点ずらし: context.features.shift,
    自己防衛: context.features.selfDefense,
    困惑: context.features.absurd,
    勝利宣言: context.features.opponentVictory,
    質問回避: context.features.question,
    感謝: context.features.gratitude,
    応援: context.features.encouragement,
  })
    .filter(([, active]) => active)
    .map(([label]) => label);

  appendSummary(els.safetySummary, "判定", context.features.risk ? "使用非推奨" : "通常");
  appendSummary(els.safetySummary, "理由", context.features.risk ? context.features.riskMatches.join("・") : "危険語なし");
  appendSummary(els.safetySummary, "文脈タグ", activeFeatures.length ? activeFeatures.join("・") : "標準");
  appendSummary(els.safetySummary, "推定tone", topToneHint(context.features.toneHints));
  els.riskPill.hidden = !context.features.risk;
}

function topToneHint(toneHints) {
  const [tone, score] =
    Object.entries(toneHints)
      .filter(([name]) => name !== "ランダム")
      .sort((a, b) => b[1] - a[1])[0] || ["ランダム", 0];
  return score > 0 ? tone : "標準";
}

function appendSummary(container, label, value) {
  const item = document.createElement("div");
  item.className = "summary-item";
  const labelEl = document.createElement("span");
  labelEl.textContent = label;
  const valueEl = document.createElement("span");
  valueEl.textContent = value;
  item.append(labelEl, valueEl);
  container.append(item);
}

function formatPostLabel(post) {
  const prefix = Number.isFinite(post.number) ? `${post.number}` : `${post.role === "self" ? "自分" : "相手"}#${post.inputOrder + 1}`;
  const body = post.text ? `: ${post.text.slice(0, 28)}` : "";
  return `${prefix}${body}`;
}

async function copyText(text, button) {
  let copied = false;
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch {
      copied = false;
    }
  }

  if (!copied) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.top = "0";
    textarea.style.left = "-9999px";
    document.body.append(textarea);
    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    copied = document.execCommand("copy");
    textarea.remove();
  }

  const originalText = button.textContent;
  button.textContent = copied ? "コピー済み" : "コピー失敗";
  button.classList.toggle("is-copied", copied);
  window.setTimeout(() => {
    button.textContent = originalText;
    button.classList.remove("is-copied");
  }, 1400);
}

function saveQuoteFromForm(event) {
  event.preventDefault();
  const id = Number(els.quoteId.value) || nextQuoteId();
  const quote = {
    id,
    quote: els.quoteText.value.trim(),
    category: els.quoteCategory.value,
    tags: splitList(els.quoteTags.value),
    tone: els.quoteTone.value,
    intensity: clamp(Number(els.quoteIntensity.value), 1, 5),
    useCase: els.quoteUseCase.value.trim(),
    triggerWords: splitList(els.quoteTriggers.value),
    triggerOnly: els.quoteTriggerOnly.checked,
    safety: els.quoteSafety.value,
    hiddenByDefault: els.quoteSafety.value === "blocked",
  };
  if (!quote.quote) return;

  const currentIndex = state.quotes.findIndex((item) => item.id === id);
  if (currentIndex >= 0) state.quotes[currentIndex] = quote;
  else state.quotes.unshift(quote);

  clearQuoteForm();
  renderQuoteCount();
  renderQuoteList();
}

function nextQuoteId() {
  return Math.max(0, ...state.quotes.map((quote) => Number(quote.id) || 0)) + 1;
}

function splitList(value) {
  return value
    .split(/[,、\s]+/)
    .map((item) => item.trim())
    .filter(Boolean);
}

function clearQuoteForm() {
  els.quoteForm.reset();
  els.quoteId.value = "";
  els.quoteIntensity.value = "2";
  els.quoteSafety.value = "safe";
}

function editQuote(id) {
  const quote = state.quotes.find((item) => item.id === id);
  if (!quote) return;
  els.quoteId.value = String(quote.id);
  els.quoteText.value = quote.quote;
  els.quoteCategory.value = quote.category;
  els.quoteTone.value = quote.tone;
  els.quoteIntensity.value = String(quote.intensity);
  els.quoteSafety.value = quote.safety;
  els.quoteTags.value = quote.tags.join(", ");
  els.quoteUseCase.value = quote.useCase;
  els.quoteTriggers.value = quote.triggerWords.join(", ");
  els.quoteTriggerOnly.checked = quote.triggerOnly;
  els.quoteText.focus();
}

function deleteQuote(id) {
  state.quotes = state.quotes.filter((quote) => quote.id !== id);
  renderQuoteCount();
  renderQuoteList();
}

function renderQuoteList() {
  const query = normalize(els.adminSearch.value || "");
  els.quoteList.textContent = "";
  const filtered = state.quotes.filter((quote) => {
    if (!query) return true;
    return normalize([quote.quote, quote.category, quote.tone, quote.tags.join(" ")].join(" ")).includes(query);
  });

  if (filtered.length === 0) {
    renderMessage(els.quoteList, "該当する語録はありません。");
    return;
  }

  for (const quote of filtered) {
    const item = document.createElement("article");
    item.className = "admin-quote";
    const content = document.createElement("div");
    const body = document.createElement("p");
    body.textContent = quote.quote;
    const meta = document.createElement("div");
    meta.className = "admin-meta";
    meta.append(
      makeBadge(quote.category, "category-badge"),
      makeBadge(`tone ${quote.tone}`, "category-badge"),
      makeBadge(`強さ ${quote.intensity}`, "category-badge"),
      makeBadge(SAFETY_LABELS[quote.safety], `safety-badge ${quote.safety}`),
    );
    if (quote.triggerOnly) meta.append(makeBadge("triggerOnly", "category-badge"));
    content.append(body, meta);

    const actions = document.createElement("div");
    actions.className = "admin-quote-actions";
    actions.append(makeActionButton("編集", "edit", quote.id), makeActionButton("削除", "delete", quote.id));
    item.append(content, actions);
    els.quoteList.append(item);
  }
}

function makeBadge(text, className) {
  const badge = document.createElement("span");
  badge.className = `badge ${className}`;
  badge.textContent = text;
  return badge;
}

function makeActionButton(text, action, id) {
  const button = document.createElement("button");
  button.className = action === "delete" ? "ghost-button" : "secondary-button";
  button.type = "button";
  button.textContent = text;
  button.dataset.action = action;
  button.dataset.id = String(id);
  return button;
}

function saveQuotesToLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.quotes, null, 2));
  flashButton(els.saveLocalButton, "保存済み");
}

function renderQuoteCount() {
  const safe = state.quotes.filter((quote) => quote.safety === "safe").length;
  const caution = state.quotes.filter((quote) => quote.safety === "caution").length;
  const blocked = state.quotes.filter((quote) => quote.safety === "blocked").length;
  els.quoteCount.textContent = `${state.quotes.length}件 / safe ${safe} / caution ${caution} / blocked ${blocked}`;
}

function flashButton(button, text) {
  const original = button.textContent;
  button.textContent = text;
  window.setTimeout(() => {
    button.textContent = original;
  }, 1400);
}

function normalize(text) {
  return String(text || "")
    .normalize("NFKC")
    .toLowerCase();
}

function clamp(value, min, max) {
  if (Number.isNaN(value)) return min;
  return Math.min(max, Math.max(min, value));
}
