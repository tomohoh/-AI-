<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08a7a0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <title>AIお絵描きゲーム</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="brand">
          <img class="brand-mark" src="./assets/mascot.svg" alt="" width="72" height="72" />
          <div>
            <p class="eyebrow">端末内AIであそぶ</p>
            <h1>AIお絵描きゲーム</h1>
          </div>
        </div>
        <button id="shareTopButton" class="icon-button" type="button" aria-label="共有" title="共有">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M16 6 8.5 10.3M8.5 13.7 16 18" />
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
          </svg>
        </button>
      </header>

      <main>
        <section id="startScreen" class="screen start-screen">
          <div class="start-visual" aria-hidden="true">
            <img src="./assets/mascot.svg" alt="" />
            <span class="spark spark-a"></span>
            <span class="spark spark-b"></span>
            <span class="spark spark-c"></span>
          </div>
          <div class="start-copy">
            <h2>20秒でお題を描こう</h2>
            <div class="trust-row">
              <span>20秒</span>
              <span>カメラなし</span>
              <span>端末内判定</span>
            </div>
            <button id="startButton" class="primary-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7Z" />
              </svg>
              スタート
            </button>
            <p id="homeStatus" class="status-line" role="status">絵は保存・送信されません。</p>
          </div>
        </section>

        <section id="gameScreen" class="screen draw-screen" hidden>
          <div class="game-head">
            <div>
              <p class="mini-label">お題</p>
              <p id="promptWord" class="prompt-word">---</p>
            </div>
            <div class="game-actions">
              <button id="judgeButton" class="primary-button compact-button" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="m9 12 2 2 4-5" />
                  <circle cx="12" cy="12" r="9" />
                </svg>
                判定
              </button>
              <div class="timer" aria-live="polite"><span id="timeLeft">20</span></div>
            </div>
          </div>

          <div class="studio">
            <aside class="tool-panel" aria-label="描画ツール">
              <div class="tool-section">
                <p class="tool-label">道具</p>
                <div class="tool-grid" role="group" aria-label="道具">
                  <button class="tool-button is-selected" type="button" data-tool="pen" aria-label="ペン" title="ペン">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="m14.5 4.5 5 5L8 21H3v-5Z" />
                      <path d="m13 6 5 5" />
                    </svg>
                  </button>
                  <button class="tool-button" type="button" data-tool="ruler" aria-label="定規" title="定規">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="m4 17 13-13 3 3L7 20Z" />
                      <path d="m8 16-2-2m5-1-2-2m5-1-2-2m5-1-2-2" />
                    </svg>
                  </button>
                  <button class="tool-button" type="button" data-tool="rect" aria-label="四角形" title="四角形">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <rect x="5" y="6" width="14" height="12" rx="1" />
                    </svg>
                  </button>
                  <button class="tool-button" type="button" data-tool="triangle" aria-label="三角形" title="三角形">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M12 5 21 19H3Z" />
                    </svg>
                  </button>
                  <button class="tool-button" type="button" data-tool="circle" aria-label="円" title="円">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="7" />
                    </svg>
                  </button>
                  <button class="tool-button" type="button" data-tool="ellipse" aria-label="楕円" title="楕円">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <ellipse cx="12" cy="12" rx="8" ry="5" />
                    </svg>
                  </button>
                  <button class="tool-button" type="button" data-tool="eraser" aria-label="消しゴム" title="消しゴム">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="m7 21 10-10-5-5L2 16v5Z" />
                      <path d="M14 4 20 10M11 21h10" />
                    </svg>
                  </button>
                  <button id="undoButton" class="tool-button" type="button" aria-label="元に戻す" title="元に戻す">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M9 7 4 12l5 5" />
                      <path d="M5 12h9a6 6 0 0 1 6 6v1" />
                    </svg>
                  </button>
                  <button id="clearButton" class="tool-button danger" type="button" aria-label="全部消す" title="全部消す">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="tool-section">
                <p class="tool-label">色</p>
                <div id="colorPalette" class="color-palette" role="group" aria-label="色"></div>
              </div>

              <div class="tool-section">
                <label class="range-label" for="sizeRange">
                  <span>太さ</span>
                  <strong id="sizeLabel">8</strong>
                </label>
                <input id="sizeRange" type="range" min="2" max="40" value="8" />
              </div>

              <label class="fill-toggle">
                <input id="fillToggle" type="checkbox" />
                <span>図形をぬる</span>
              </label>
            </aside>

            <div class="canvas-area">
              <canvas id="drawCanvas" width="900" height="620" aria-label="絵を描く場所"></canvas>
              <div id="aiBubble" class="ai-bubble" role="status">お題を見て、自由に描いてね。</div>
            </div>
          </div>
        </section>

        <section id="resultScreen" class="screen result-screen" hidden>
          <div class="result-panel">
            <p id="resultBadge" class="result-badge">PERFECT!</p>
            <h2 id="resultTitle">AIの予想</h2>
            <p id="guessWord" class="guess-word">---</p>
            <p id="resultMessage" class="result-message"></p>
            <div class="result-actions">
              <button id="againButton" class="primary-button" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.7" />
                  <path d="M4 4v4.7h4.7" />
                </svg>
                もう一度
              </button>
              <button id="finishButton" class="secondary-button" type="button">終わる</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
